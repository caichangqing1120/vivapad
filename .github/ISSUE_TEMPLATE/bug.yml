name: Bug report
description: Report a reproducible defect without sharing private documents
title: '[Bug] '
labels: [bug]
body:
  - type: input
    id: platform
    attributes:
      label: OS, architecture and VivaPad revision
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and minimal input
      description: Describe reproduction in text without credentials or private contents. Keep docs, Specs, plans, screenshots and captures local; do not attach them.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and verification summary
      description: List commands, results and platform details in text without uploading local evidence files.
    validations:
      required: true
