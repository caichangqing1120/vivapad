name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: 'off'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject local documents, plans and screenshots
        run: node tools/github/check-public-files.cjs
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        run: |
          files=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go mod verify
      - run: go vet ./...
      - run: node --test tools/github/*.test.cjs
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  native:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - name: Build native executable
        id: build
        env:
          OUTPUT: build/vivapad${{ runner.os == 'Windows' && '.exe' || '' }}
        run: go build -o "$OUTPUT" ./cmd/vivapad
      - name: Check command-line help
        timeout-minutes: 1
        env:
          OUTPUT: build/vivapad${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          usage=$("$OUTPUT" --help)
          [[ "$usage" == "Usage: vivapad "* ]]
      - name: Check command-line help in a Windows GUI build
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gui = Join-Path $env:RUNNER_TEMP 'vivapad-gui.exe'
          $output = Join-Path $env:RUNNER_TEMP 'vivapad-cli-help.txt'
          go build -ldflags '-H=windowsgui' -o $gui ./cmd/vivapad
          if ($LASTEXITCODE -ne 0) { throw 'Build Windows GUI executable failed' }
          $child = Start-Process -FilePath $gui -ArgumentList '--help' -RedirectStandardOutput $output -PassThru -Wait
          if ($child.ExitCode -ne 0 -or (Get-Content -Raw -LiteralPath $output) -notlike 'Usage: vivapad *') {
            throw 'Windows GUI executable did not print command-line help'
          }
      - name: Run unit and integration tests
        run: |
          if [[ "$RUNNER_OS" != Windows ]]; then
            go test ./... -count=1 -timeout=15m
            exit
          fi
          # Run the external-action package separately so console startup does
          # not compete with desktop and editor tests in other packages.
          listed=$(go list ./...)
          packages=()
          while IFS= read -r package; do
            if [[ "$package" != vivapad/internal/external ]]; then
              packages+=("$package")
            fi
          done <<< "$listed"
          go test "${packages[@]}" -count=1 -timeout=15m
      - name: Run Windows console and external action tests
        if: runner.os == 'Windows'
        run: go test ./internal/external -count=1 -v -timeout=2m
      - name: Compare RTL, clipboard and multi-selection macros with Notepad++
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP ('vivapad-rtl-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $work | Out-Null
          try {
            $zip = Join-Path $work 'notepad++.zip'
            Invoke-WebRequest -Uri 'https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.8.1/npp.8.9.8.1.portable.x64.zip' -OutFile $zip
            if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne 'beddf5548e75c97930d1575ba1c7d113e6e2b33d0a200310e734ca08e225f414') {
              throw 'Unexpected Notepad++ portable ZIP checksum'
            }
            $reference = Join-Path $work 'npp'
            Expand-Archive -LiteralPath $zip -DestinationPath $reference
            # Notepad++ supports RTL only with its GDI rendering technology.
            Set-Content -LiteralPath (Join-Path $reference 'config.xml') -Encoding utf8 -Value '<NotepadPlus><GUIConfigs><GUIConfig name="MISC" writeTechnologyEngine="0" /></GUIConfigs></NotepadPlus>'
            $env:VIVAPAD_RTL_REFERENCE_EXE = Join-Path $reference 'notepad++.exe'
            $env:VIVAPAD_RTL_DESKTOP_EXE = (Resolve-Path -LiteralPath 'build/vivapad.exe').Path
            $env:VIVAPAD_CLIPBOARD_FIXTURE_EXE = Join-Path $work 'vivapad-clipboard.test.exe'
            go test -c -o $env:VIVAPAD_CLIPBOARD_FIXTURE_EXE ./cmd/vivapad
            if ($LASTEXITCODE -ne 0) { throw 'Build Windows clipboard fixture failed' }
            go test ./tools/windows -run '^Test(RTLDesktopMatchesNotepadPlusPlus|NotepadPlusPlus(SummaryWords|SelectionHash|DocumentPathClipboard|LegacySessionSelection|MultiSelection(Clipboard|WordBoundaries|Macros)|FirstMultiSelectFromCaret|MultiSelect(SearchOrigin|FromCarets|AllFromMixedSelection))|VivaPadMultiSelectionClipboardRoundTrip)$' -count=1 -v -timeout=3m
            if ($LASTEXITCODE -ne 0) { throw 'Native desktop reference checks failed' }
            $env:VIVAPAD_WINDOWS_CLIPBOARD_TEST = '1'
            go test ./cmd/vivapad -run '^TestMultiSelectionWritesWindowsClipboard$' -count=1 -v -timeout=1m
            if ($LASTEXITCODE -ne 0) { throw 'VivaPad native clipboard comparison failed' }
            go test ./cmd/vivapad -run '^TestSelectionHashWritesWindowsClipboard$' -count=1 -v -timeout=1m
            if ($LASTEXITCODE -ne 0) { throw 'VivaPad native selection hash comparison failed' }
            go test ./cmd/vivapad -run '^TestDocumentPathsWriteWindowsClipboard$' -count=1 -v -timeout=1m
            if ($LASTEXITCODE -ne 0) { throw 'VivaPad native document path comparison failed' }
            go test ./tools/windows -run '^TestWindowsRecentClosedFileRestore$' -count=1 -v -timeout=2m
            if ($LASTEXITCODE -ne 0) { throw 'Native recent file restore comparison failed' }
            $env:VIVAPAD_WINDOWS_HELP_TEST = '1'
            go test ./tools/windows -run '^TestVivaPadWindowsHelpDialogs$' -count=1 -v -timeout=3m
            if ($LASTEXITCODE -ne 0) { throw 'VivaPad native Help dialog checks failed' }
          } finally {
            Remove-Item -LiteralPath $work -Recurse -Force
          }
      - name: Upload unsigned executable
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vivapad-${{ runner.os }}-${{ runner.arch }}
          path: build/vivapad*
          if-no-files-found: error
          retention-days: 7

  race:
    name: Race
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - run: go test -race ./... -count=1 -timeout=20m

  gate:
    name: CI
    if: ${{ always() }}
    needs: [quality, native, race]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          NATIVE: ${{ needs.native.result }}
          RACE: ${{ needs.race.result }}
        run: |
          test "$QUALITY" = success
          test "$NATIVE" = success
          test "$RACE" = success
