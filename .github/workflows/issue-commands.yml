name: Issue commands

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  command:
    name: Handle issue command
    if: >-
      ${{ !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' &&
          (contains(github.event.comment.body, '/claim') ||
           contains(github.event.comment.body, '/unclaim') ||
           contains(github.event.comment.body, '/close')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { handleIssueComment } = require('./tools/github/automation.cjs');
            core.info(await handleIssueComment({ github, context }));
